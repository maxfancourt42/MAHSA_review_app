<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deep Learning Review App</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="./style.css">
</head>
  <body>
      <nav class="navbar bg-body-tertiary">
        <div class="container-fluid">
          <span class="navbar-brand mb-0 h1"><a class="navbar-brand" href="index.html">Deep Learning Review App</a></span>
          <span>
            <h3><a class="navbar-brand" href="index.html"><i class="bi bi-house"></i></a></h3>
          </span>
        </div>
      </nav>
      <div class="container">
        <div id="carouselExample" class="carousel slide">
          <div class="carousel-inner">
            <div class="carousel-item active"><img src="imgs/splash_imgs/splash_1.png" class="d-block w-100 carousel-img" alt="..."></div>
            <div class="carousel-item"><img src="imgs/splash_imgs/splash_2.png" class="d-block w-100 carousel-img" alt="..."></div>
            <div class="carousel-item"><img src="imgs/splash_imgs/splash_3.png" class="d-block w-100 carousel-img" alt="..."></div>
            <div class="carousel-item"><img src="imgs/splash_imgs/splash_4.png" class="d-block w-100 carousel-img" alt="..."></div>
            <div class="carousel-item"><img src="imgs/splash_imgs/splash_5.png" class="d-block w-100 carousel-img" alt="..."></div>
            <div class="carousel-item"><img src="imgs/splash_imgs/splash_6.png" class="d-block w-100 carousel-img" alt="..."></div>
            <div class="carousel-item"><img src="imgs/splash_imgs/splash_7.png" class="d-block w-100 carousel-img" alt="..."></div>
          </div>
          <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev"><span class="carousel-control-prev-icon"></span></button>
          <button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next"><span class="carousel-control-next-icon"></span></button>
        </div>
        <div class="row mt-2" style="align-items:center">
          <div class="col">
            <p class="text-start fs-2">Welcome <span id="reviewer_name">None Selected</span></p>
          </div>
          <div class="col">
            <div class="progress" style="height: 40px;">
              <div class="progress-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="review_progress"></div>
            </div>
          </div>
        </div>
        <div class="d-flex flex-column align-items-center gap-2 mt-2">
          <form>
            <label class="fw-bold" for="reviewer_select">Please select your name from the drop downlist </label>
            <select class="form-select" aria-label="Default select example" id="reviewer_select">
              <option value="1">Dr Pete</option>
              <option value="2">Mou</option>
              <option value="3">Afifa</option>
              <option value="4">Vaneshree</option>
              <option value="5">Jack</option>
              <option value="6">Cameron</option>
              <option value="7">Rebecca</option>
              <option value="8">Dan</option>
              <option value="9">Iqtedar</option>
              <option value="10">Junaid</option>
              <option value="11">Kuili</option>
              <option value="12">Azadeh</option>
            </select>
          </form>
          <a id="startreview" class="btn btn-primary btn-lg" href="review.html" role="button">Start Review</a>
          <button type="button" class="btn btn-danger btn-lg" id="settings_button">Don't Press This Button</button>
          <button type="button" class="btn btn-primary btn-lg" id="export_button">Export Results to CSV</button>
          <button id="resetProgressBtn" class="btn btn-outline-danger">Reset progress</button>
        </div>
        <div><b>Shortcuts:</b>
          <ul>
            <li>Move mouse over images to enlarge</li>
            <li>Left arrow - Go to previous review</li>
            <li>Right arrow - Go to next review</li>
            <li>Up arrow - Wipe current answers</li>
          </ul>
        </div>    
      </div>
      <nav class="navbar bg-body-tertiary bottom-navbar">
        <div class="container-fluid justify-content-center">
          <span class="navbar-brand mb-0 h1 text-center ">Mapping Archaeological Heritage in South Asia</span>
        </div>
      </nav>
      <div id="balloon-container"></div>
    <script src="./candidates.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="index_script.js"></script>
  </body>
</html>
